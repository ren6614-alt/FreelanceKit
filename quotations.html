<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Quotations — FreelanceKit</title>
  <meta name="robots" content="noindex,nofollow">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="manifest" href="manifest.json">
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,560&family=Outfit:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="page" hidden>
    <div class="toolbar">
      <input class="search" id="search" placeholder="Search quotations">
      <button class="btn" type="button" id="add">New quotation</button>
    </div>
    <div id="list"></div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
  <script src="config.js"></script>
  <script src="ui.js"></script>
  <script src="auth.js"></script>
  <script src="database.js"></script>
  <script src="subscription.js"></script>
  <script src="invoices.js"></script>
  <script src="quotations.js"></script>
  <script src="clients.js"></script>
  <script src="payments.js"></script>
  <script src="pdf.js"></script>
  <script src="app.js"></script>
  <script>
    const FK = FreelanceKit;
    let quotations = [], clients = [];

    function clientOptions(selected) {
      return clients.map((c) => `<option value="${c.id}" ${c.id === selected ? "selected" : ""}>${FK.ui.escapeHtml(c.name)}</option>`).join("");
    }

    async function openEditor(existing) {
      if (!existing && !FK.subscriptionApi.canCreateQuotation()) {
        FK.ui.toast(FK.subscriptionApi.limitMessage("quotations"), "error");
        FK.ui.showUpgrade("unlimited quotations");
        return;
      }
      if (!clients.length) { FK.ui.toast("Add a client first."); location.href = "clients.html"; return; }
      const num = existing ? existing.number : (await FK.db.nextDocumentNumber("quotation")).number;
      const currency = (FK.profile && FK.profile.default_currency) || "INR";
      FK.ui.modal(`<h2>${existing ? "Edit quotation" : "New quotation"}</h2>
        <form id="qform">
          <div class="form-grid">
            <label>Number <input name="number" value="${FK.ui.escapeHtml(num)}" required></label>
            <label>Client <select name="client_id">${clientOptions(existing && existing.client_id)}</select></label>
            <label>Date <input type="date" name="issue_date" value="${existing ? existing.issue_date : FK.ui.todayISO()}"></label>
            <label>Expiry date <input type="date" name="expiry_date" value="${existing && existing.expiry_date ? existing.expiry_date : ""}"></label>
            <label>Status <select name="status">${["draft","sent","accepted","rejected","expired"].map((s) => `<option ${existing && existing.status === s ? "selected" : ""}>${s}</option>`).join("")}</select></label>
            <label>Discount <input type="number" step="0.01" id="discount" name="discount" value="${existing ? existing.discount : 0}"></label>
            <label>Tax % <input type="number" step="0.01" id="tax_rate" name="tax_rate" value="${existing ? existing.tax_rate : 0}"></label>
            <label class="full">Notes <textarea name="notes">${FK.ui.escapeHtml(existing && existing.notes || "")}</textarea></label>
          </div>
          ${FK.app.itemEditor(existing && existing.quotation_items)}
          <div class="toolbar"><button class="btn btn-ghost" type="button" data-close>Cancel</button><button class="btn" type="submit">Save</button></div>
        </form>`, { wide: true });
      document.querySelector("[data-close]").onclick = FK.ui.closeModal;
      FK.app.bindItemCalc("#discount", "#tax_rate", currency);
      document.getElementById("qform").onsubmit = async (e) => {
        e.preventDefault();
        const fd = Object.fromEntries(new FormData(e.target).entries());
        const calc = FK.invoices.totals(FK.app.collectItems(), Number(fd.discount || 0), Number(fd.tax_rate || 0));
        try {
          const payload = {
            client_id: fd.client_id,
            number: fd.number,
            issue_date: fd.issue_date,
            expiry_date: fd.expiry_date || null,
            status: fd.status,
            currency,
            notes: fd.notes,
            discount: calc.discount,
            tax_rate: Number(fd.tax_rate || 0),
            subtotal: calc.subtotal,
            tax_total: calc.taxTotal,
            total: calc.total,
            template: "basic",
          };
          if (existing) payload.id = existing.id;
          await FK.db.saveQuotation(payload, calc.lines);
          if (!existing) {
            const n = await FK.db.nextDocumentNumber("quotation");
            if (fd.number === n.number) await FK.db.bumpNumber("quotation", n.next);
            FK.ui.toast("Quotation created");
          } else FK.ui.toast("Quotation updated");
          FK.ui.closeModal();
          await reload();
        } catch (ex) {
          FK.ui.toast(FK.ui.friendlyError(ex, "Could not save quotation."), "error");
        }
      };
    }

    function paint(filter) {
      const q = (filter || "").toLowerCase();
      const rows = quotations.filter((i) => (i.number + " " + ((i.clients && i.clients.name) || "")).toLowerCase().includes(q));
      const el = document.getElementById("list");
      if (!rows.length) {
        el.innerHTML = `<div class="empty"><h3>No quotations yet.</h3><p>Create a quotation to send pricing before you invoice.</p><button class="btn" id="empty-add">New quotation</button></div>`;
        document.getElementById("empty-add").onclick = () => document.getElementById("add").click();
        return;
      }
      el.innerHTML = `<div class="table-wrap"><table class="data"><thead><tr><th>Number</th><th>Client</th><th>Total</th><th>Status</th><th></th></tr></thead><tbody>
        ${rows.map((i) => `<tr>
          <td>${FK.ui.escapeHtml(i.number)}</td>
          <td>${FK.ui.escapeHtml((i.clients && i.clients.name) || "")}</td>
          <td>${FK.ui.formatMoney(i.total, i.currency)}</td>
          <td>${FK.app.statusBadge(i.status)}</td>
          <td>
            <button class="btn btn-ghost btn-sm" data-edit="${i.id}">Edit</button>
            <button class="btn btn-ghost btn-sm" data-pdf="${i.id}">PDF</button>
            <button class="btn btn-ghost btn-sm" data-convert="${i.id}">Convert to invoice</button>
            <button class="btn btn-ghost btn-sm" data-del="${i.id}">Delete</button>
          </td>
        </tr>`).join("")}
      </tbody></table></div>`;
    }

    async function reload() {
      quotations = await FK.db.listQuotations();
      await FK.quotations.persistExpired(quotations);
      clients = await FK.db.listClients();
      await FK.subscriptionApi.getUsage();
      paint(document.getElementById("search").value);
    }

    FK.app.bootPrivate({
      active: "quotations",
      title: "Quotations",
      contentSelector: "#page",
      render: async () => {
        document.getElementById("page").hidden = false;
        document.getElementById("add").onclick = () => openEditor(null);
        document.getElementById("search").oninput = (e) => paint(e.target.value);
        document.getElementById("list").addEventListener("click", async (e) => {
          const edit = e.target.getAttribute("data-edit");
          const pdf = e.target.getAttribute("data-pdf");
          const conv = e.target.getAttribute("data-convert");
          const del = e.target.getAttribute("data-del");
          if (edit) openEditor(await FK.db.getQuotation(edit));
          if (pdf) await FK.pdf.downloadPdf("quotation", await FK.db.getQuotation(pdf));
          if (conv) {
            try {
              const inv = await FK.quotations.convertToInvoice(conv);
              if (inv) { FK.ui.toast("Quotation converted to invoice " + inv.number); location.href = "invoices.html"; }
            } catch (ex) { FK.ui.toast(FK.ui.friendlyError(ex, "Could not convert quotation."), "error"); }
          }
          if (del && await FK.ui.confirmDialog("Delete this quotation?")) {
            try { await FK.db.deleteQuotation(del); FK.ui.toast("Quotation deleted"); await reload(); }
            catch (ex) { FK.ui.toast(FK.ui.friendlyError(ex, "Could not delete."), "error"); }
          }
        });
        await reload();
      },
    }).catch(() => {});
  </script>
</body>
</html>
