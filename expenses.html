<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Expenses — FreelanceKit</title>
  <meta name="robots" content="noindex,nofollow">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="manifest" href="manifest.json">
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,560&family=Outfit:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="page" hidden>
    <p><span class="badge badge-pro">PRO</span> Expense tracking and profit estimate.</p>
    <div class="stats" id="stats"></div>
    <div class="toolbar"><button class="btn" type="button" id="add">Add expense</button></div>
    <div id="list"></div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
  <script src="config.js"></script>
  <script src="ui.js"></script>
  <script src="auth.js"></script>
  <script src="database.js"></script>
  <script src="subscription.js"></script>
  <script src="invoices.js"></script>
  <script src="quotations.js"></script>
  <script src="clients.js"></script>
  <script src="payments.js"></script>
  <script src="pdf.js"></script>
  <script src="app.js"></script>
  <script>
    const FK = FreelanceKit;
    let expenses = [];

    async function reload() {
      if (FK.plan !== "pro") return;
      expenses = await FK.db.listExpenses();
      const invoices = await FK.db.listInvoices();
      const now = new Date();
      const ym = now.toISOString().slice(0, 7);
      const y = String(now.getFullYear());
      const total = expenses.reduce((s, e) => s + Number(e.amount || 0), 0);
      const monthly = expenses.filter((e) => (e.incurred_on || "").startsWith(ym)).reduce((s, e) => s + Number(e.amount || 0), 0);
      const yearly = expenses.filter((e) => (e.incurred_on || "").startsWith(y)).reduce((s, e) => s + Number(e.amount || 0), 0);
      const revenue = invoices.reduce((s, i) => s + Number(i.amount_paid || 0), 0);
      document.getElementById("stats").innerHTML = `
        <div class="stat"><div class="label">Total expenses</div><div class="value">${FK.ui.formatMoney(total)}</div></div>
        <div class="stat"><div class="label">Monthly expenses</div><div class="value">${FK.ui.formatMoney(monthly)}</div></div>
        <div class="stat"><div class="label">Yearly expenses</div><div class="value">${FK.ui.formatMoney(yearly)}</div></div>
        <div class="stat"><div class="label">Profit estimate</div><div class="value">${FK.ui.formatMoney(revenue - total)}</div></div>`;
      const el = document.getElementById("list");
      if (!expenses.length) {
        el.innerHTML = `<div class="empty"><h3>No expenses yet.</h3><p>Track software, travel, and other costs to estimate profit.</p><button class="btn" id="empty-add">Add expense</button></div>`;
        document.getElementById("empty-add").onclick = () => document.getElementById("add").click();
        return;
      }
      el.innerHTML = `<div class="table-wrap"><table class="data"><thead><tr><th>Name</th><th>Category</th><th>Date</th><th>Amount</th><th></th></tr></thead><tbody>
        ${expenses.map((e) => `<tr>
          <td>${FK.ui.escapeHtml(e.name)}</td><td>${FK.ui.escapeHtml(e.category)}</td>
          <td>${FK.ui.formatDate(e.incurred_on)}</td><td>${FK.ui.formatMoney(e.amount)}</td>
          <td><button class="btn btn-ghost btn-sm" data-del="${e.id}">Delete</button></td>
        </tr>`).join("")}
      </tbody></table></div>`;
    }

    FK.app.bootPrivate({
      active: "expenses",
      title: "Expenses",
      contentSelector: "#page",
      render: async () => {
        document.getElementById("page").hidden = false;
        if (FK.plan !== "pro") {
          document.getElementById("page").innerHTML = `<div class="empty"><span class="badge badge-pro">PRO</span><h3>Expense tracking is a Pro feature</h3><p>Unlock expenses, profit estimates, and analytics.</p><a class="btn" href="pricing.html">Upgrade to Pro</a></div>`;
          return;
        }
        document.getElementById("add").onclick = () => {
          FK.ui.modal(`<h2>Add expense</h2>
            <form id="eform" class="form-grid">
              <label>Name <input name="name" required></label>
              <label>Amount <input type="number" step="0.01" name="amount" required></label>
              <label>Category <select name="category">
                <option>software</option><option>equipment</option><option>internet</option>
                <option>travel</option><option>marketing</option><option>office</option><option>other</option>
              </select></label>
              <label>Date <input type="date" name="incurred_on" value="${FK.ui.todayISO()}"></label>
              <label class="full">Notes <textarea name="notes"></textarea></label>
              <div class="full"><button class="btn" type="submit">Save</button></div>
            </form>`);
          document.getElementById("eform").onsubmit = async (e) => {
            e.preventDefault();
            const fd = Object.fromEntries(new FormData(e.target).entries());
            fd.amount = Number(fd.amount);
            try {
              await FK.db.saveExpense(fd);
              FK.ui.toast("Expense saved");
              FK.ui.closeModal();
              await reload();
            } catch (ex) { FK.ui.toast(FK.ui.friendlyError(ex, "Could not save expense."), "error"); }
          };
        };
        document.getElementById("list").addEventListener("click", async (e) => {
          const id = e.target.getAttribute("data-del");
          if (id && await FK.ui.confirmDialog("Delete expense?")) {
            await FK.db.deleteExpense(id);
            await reload();
          }
        });
        await reload();
      },
    }).catch(() => {});
  </script>
</body>
</html>
