<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Payments — FreelanceKit</title>
  <meta name="robots" content="noindex,nofollow">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="manifest" href="manifest.json">
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,560&family=Outfit:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="page" hidden>
    <p class="help">These records track money you received outside FreelanceKit. FreelanceKit has not processed these payments unless a gateway is connected.</p>
    <div class="toolbar">
      <button class="btn" type="button" id="add">Record payment</button>
    </div>
    <div id="list"></div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
  <script src="config.js"></script>
  <script src="ui.js"></script>
  <script src="auth.js"></script>
  <script src="database.js"></script>
  <script src="subscription.js"></script>
  <script src="invoices.js"></script>
  <script src="quotations.js"></script>
  <script src="clients.js"></script>
  <script src="payments.js"></script>
  <script src="pdf.js"></script>
  <script src="app.js"></script>
  <script>
    const FK = FreelanceKit;
    let payments = [], invoices = [];

    async function reload() {
      payments = await FK.db.listPayments();
      invoices = await FK.db.listInvoices();
      const el = document.getElementById("list");
      if (!payments.length) {
        el.innerHTML = `<div class="empty"><h3>No payments recorded.</h3><p>Log a bank transfer, UPI, cash, or card payment against an invoice.</p><button class="btn" id="empty-add">Record payment</button></div>`;
        document.getElementById("empty-add").onclick = () => document.getElementById("add").click();
        return;
      }
      el.innerHTML = `<div class="table-wrap"><table class="data"><thead><tr><th>Date</th><th>Invoice</th><th>Amount</th><th>Method</th><th>Reference</th><th></th></tr></thead><tbody>
        ${payments.map((p) => `<tr>
          <td>${FK.ui.formatDate(p.paid_at)}</td>
          <td>${FK.ui.escapeHtml((p.invoices && p.invoices.number) || "")}</td>
          <td>${FK.ui.formatMoney(p.amount)}</td>
          <td>${FK.ui.escapeHtml(p.method)}</td>
          <td>${FK.ui.escapeHtml(p.reference || "—")}</td>
          <td><button class="btn btn-ghost btn-sm" data-del="${p.id}" data-inv="${p.invoice_id}">Delete</button></td>
        </tr>`).join("")}
      </tbody></table></div>`;
    }

    FK.app.bootPrivate({
      active: "payments",
      title: "Payments",
      contentSelector: "#page",
      render: async () => {
        document.getElementById("page").hidden = false;
        document.getElementById("add").onclick = () => {
          const open = invoices.filter((i) => i.status !== "paid" && i.status !== "draft");
          const opts = (open.length ? open : invoices).map((i) => `<option value="${i.id}">${FK.ui.escapeHtml(i.number)} · due ${FK.ui.formatMoney(Math.max((i.total||0)-(i.amount_paid||0),0), i.currency)}</option>`).join("");
          if (!invoices.length) { FK.ui.toast("Create an invoice first."); return; }
          FK.ui.modal(`<h2>Record payment</h2>
            <form id="pform" class="form-grid">
              <label>Invoice <select name="invoice_id" required>${opts}</select></label>
              <label>Amount <input type="number" step="0.01" name="amount" required></label>
              <label>Date <input type="date" name="paid_at" value="${FK.ui.todayISO()}" required></label>
              <label>Method <select name="method">
                <option value="bank_transfer">Bank transfer</option>
                <option value="upi">UPI</option>
                <option value="cash">Cash</option>
                <option value="card">Card</option>
                <option value="other">Other</option>
              </select></label>
              <label>Reference <input name="reference"></label>
              <label class="full">Notes <textarea name="notes"></textarea></label>
              <div class="full toolbar"><button class="btn btn-ghost" type="button" data-close>Cancel</button><button class="btn" type="submit">Save</button></div>
            </form>`);
          document.querySelector("[data-close]").onclick = FK.ui.closeModal;
          document.getElementById("pform").onsubmit = async (e) => {
            e.preventDefault();
            const fd = Object.fromEntries(new FormData(e.target).entries());
            try {
              await FK.db.savePayment({
                invoice_id: fd.invoice_id,
                amount: Number(fd.amount),
                paid_at: fd.paid_at,
                method: fd.method,
                reference: fd.reference,
                notes: fd.notes,
              });
              await FK.invoices.syncInvoicePaymentState(fd.invoice_id);
              FK.ui.toast("Payment recorded");
              FK.ui.closeModal();
              await reload();
            } catch (ex) {
              FK.ui.toast(FK.ui.friendlyError(ex, "Could not record payment."), "error");
            }
          };
        };
        document.getElementById("list").addEventListener("click", async (e) => {
          const id = e.target.getAttribute("data-del");
          const inv = e.target.getAttribute("data-inv");
          if (id && await FK.ui.confirmDialog("Delete this payment record?")) {
            try {
              await FK.db.deletePayment(id);
              if (inv) await FK.invoices.syncInvoicePaymentState(inv);
              await reload();
            } catch (ex) { FK.ui.toast(FK.ui.friendlyError(ex, "Could not delete."), "error"); }
          }
        });
        await reload();
      },
    }).catch(() => {});
  </script>
</body>
</html>
