<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reset password — FreelanceKit</title>
  <meta name="robots" content="noindex,nofollow">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600&family=Fraunces:opsz,wght@9..144,560&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="auth-wrap">
    <div class="auth-card card">
      <h1>Set a new password</h1>
      <form id="form">
        <label>New password <input type="password" name="password" required minlength="8" autocomplete="new-password"></label>
        <button class="btn" type="submit" style="width:100%;margin-top:16px">Update password</button>
      </form>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="ui.js"></script>
  <script src="auth.js"></script>
  <script>
    const FK = FreelanceKit;
    FK.ui.initTheme();
    document.getElementById("form").onsubmit = async (e) => {
      e.preventDefault();
      try {
        await FK.auth.updatePassword(new FormData(e.target).get("password"));
        FK.ui.toast("Password updated.");
        location.replace("dashboard.html");
      } catch (err) {
        FK.ui.toast(FK.ui.friendlyError(err, "Could not update password. Open the link from your email."), "error");
      }
    };
  </script>
</body>
</html>
